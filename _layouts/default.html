<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07131d">
  <title>{{ page.title | default: site.title }}{% unless page.title == site.title %} — {{ site.title }}{% endunless %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
  <script>
    (function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();
  </script>
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header">
      <a href="{{ '/' | relative_url }}" class="brand-link" aria-label="Tidewritten home"><span class="brand-mark" aria-hidden="true">≈</span><span class="brand-word">Tidewritten</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/stories' | relative_url }}" {% if page.url == '/stories.html' or page.url == '/stories/' %}aria-current="page"{% endif %}>Stories</a>
        <a href="{{ '/coming-soon' | relative_url }}" {% if page.url == '/coming-soon.html' or page.url == '/coming-soon/' %}aria-current="page"{% endif %}>On the horizon</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme" title="Toggle theme"><span class="theme-toggle-icon" aria-hidden="true">◐</span></button>
    </header>
    <main class="content-area">
      {{ content }}
    </main>
    <footer class="site-footer">
      <span class="footer-wave" aria-hidden="true">〰</span>
      <p><strong>Tidewritten</strong> <span>— some feelings leave a tide behind.</span></p>
      <a href="{{ '/stories' | relative_url }}">Find your next story <span aria-hidden="true">↗</span></a>
    </footer>
  </div>
  <script>
    (function(){
      var toggle=document.getElementById('themeToggle');
      if(!toggle)return;
      function paint(){var light=document.documentElement.getAttribute('data-theme')==='light';toggle.innerHTML='<span class="theme-toggle-icon" aria-hidden="true">'+(light?'☼':'◐')+'</span>';toggle.setAttribute('aria-label',light?'Switch to dark theme':'Switch to light theme');}
      paint();
      toggle.addEventListener('click',function(){
        var light=document.documentElement.getAttribute('data-theme')==='light';
        if(light){document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('theme','dark');}catch(e){}}
        else{document.documentElement.setAttribute('data-theme','light');try{localStorage.setItem('theme','light');}catch(e){}}
        paint();
      });
    })();
  </script>
</body>
</html>
