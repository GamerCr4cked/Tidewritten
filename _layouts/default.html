<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07131d">
  <title>{{ page.title | default: site.title }}{% unless page.title == site.title %} — {{ site.title }}{% endunless %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/icon.png' | relative_url }}">
  <script>
    (function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();
  </script>
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header">
      <a href="{{ '/' | relative_url }}" class="brand-link" aria-label="Tidewritten home"><span class="brand-mark" aria-hidden="true">≈</span><span class="brand-word">Tidewritten</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' or page.url == '/home/' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/library/' | relative_url }}" {% if page.url == '/library.html' or page.url == '/library/' %}aria-current="page"{% endif %}>Library</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about.html' or page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
        <a href="{{ '/creator/' | relative_url }}" {% if page.url == '/creator.html' or page.url == '/creator/' %}aria-current="page"{% endif %}>Creator</a>
        <a href="{{ '/reading-guide/' | relative_url }}" {% if page.url == '/reading-guide.html' or page.url == '/reading-guide/' %}aria-current="page"{% endif %}>Reading Guide</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme" title="Toggle theme"><span class="theme-toggle-icon" aria-hidden="true">◐</span></button>
    </header>
    <main class="content-area">
      <aside class="reading-resume-card" id="readingResumeCard" aria-label="Continue reading" hidden>
        <div class="reading-resume-topline">
          <span class="reading-resume-kicker">YOUR READING THREAD</span>
          <button class="reading-resume-dismiss" id="readingResumeDismiss" type="button" aria-label="Dismiss reading suggestion" title="Dismiss">×</button>
        </div>
        <div class="reading-resume-copy">
          <h2>Pick up where you left off</h2>
          <p id="readingResumeStory"></p>
          <span class="reading-resume-chapter" id="readingResumeChapter"></span>
        </div>
        <a class="reading-resume-link" id="readingResumeLink" href="#">
          <span class="reading-resume-link-label">Continue reading</span>
          <span class="reading-resume-link-icon" aria-hidden="true">↗</span>
        </a>
      </aside>
      {{ content }}
    </main>
    <footer class="site-footer">
      <span class="footer-wave" aria-hidden="true">〰</span>
      <p><strong>Tidewritten</strong> <span>— some feelings leave a tide behind.</span></p>
      <a href="{{ '/library/' | relative_url }}">Browse the Library <span aria-hidden="true">↗</span></a>
    </footer>
  </div>
  <script>
    (function(){
      var resumeCard=document.getElementById('readingResumeCard');
      if(resumeCard){
        try{
          var saved=JSON.parse(localStorage.getItem('tidewritten-reading-progress-v1')||'null');
          if(saved&&saved.url&&saved.title){
            var story=document.getElementById('readingResumeStory');
            var chapter=document.getElementById('readingResumeChapter');
            var link=document.getElementById('readingResumeLink');
            story.textContent=saved.title;
            chapter.textContent=saved.chapterTitle||'Continue from your last position';
            link.href=saved.url+'?resume=1';
            resumeCard.hidden=false;
            // Keep hover expansion state under our control instead of relying on :hover
            // while the card itself is changing size. A short close delay prevents the
            // pointer from bouncing between the collapsed launcher and expanded panel.
            var hoverMedia=window.matchMedia&&window.matchMedia('(hover: hover) and (min-width: 601px)');
            var hoverCloseTimer=null;
            if(hoverMedia&&hoverMedia.matches){
              resumeCard.addEventListener('pointerenter',function(event){
                if(event.pointerType==='touch')return;
                window.clearTimeout(hoverCloseTimer);
                resumeCard.classList.add('is-hover-expanded');
              });
              resumeCard.addEventListener('pointerleave',function(event){
                if(event.pointerType==='touch')return;
                window.clearTimeout(hoverCloseTimer);
                hoverCloseTimer=window.setTimeout(function(){
                  resumeCard.classList.remove('is-hover-expanded');
                },180);
              });
            }
            var dismiss=document.getElementById('readingResumeDismiss');
            var resumeLink=document.getElementById('readingResumeLink');
            dismiss.addEventListener('click',function(){resumeCard.hidden=true;});
            resumeLink.addEventListener('click',function(event){
              if(window.matchMedia&&window.matchMedia('(hover: none)').matches&&!resumeCard.classList.contains('is-expanded')){
                event.preventDefault();
                resumeCard.classList.add('is-expanded');
              }
            });
          }
        }catch(e){}
      }
      var toggle=document.getElementById('themeToggle');
      if(!toggle)return;
      function paint(){var light=document.documentElement.getAttribute('data-theme')==='light';toggle.innerHTML='<span class="theme-toggle-icon" aria-hidden="true">'+(light?'☼':'◐')+'</span>';toggle.setAttribute('aria-label',light?'Switch to dark theme':'Switch to light theme');}
      paint();
      toggle.addEventListener('click',function(){
        var light=document.documentElement.getAttribute('data-theme')==='light';
        if(light){document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('theme','dark');}catch(e){}}
        else{document.documentElement.setAttribute('data-theme','light');try{localStorage.setItem('theme','light');}catch(e){}}
        paint();
      });
    })();
  </script>
</body>
</html>
